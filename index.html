<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04162c">
  <meta name="description" content="操作芯狮完成立正、跨立、向左转、向右转、齐步走和正步走训练。">
  <title>芯狮军训场</title>
  <link rel="stylesheet" href="styles.css?v=goose-user-sheet-1">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="chip" aria-hidden="true"></span><div><small>集成电路学院</small><h1>芯狮军训场</h1></div></div>
    <div class="ready"><i></i>无需登录 · 系统已就绪</div>
  </header>

  <main class="layout">
    <section class="stage" aria-live="polite">
      <div class="stage-title"><small>ACTION / <span id="action-en">ATTENTION</span></small><h2><span id="action-name">立正</span>！</h2><p id="action-hint">抬头、挺胸、双脚并拢</p></div>
      <button id="speak" class="sound" aria-label="播放当前口令">🔊</button>
      <div class="scan"></div><div class="platform"></div>
      <div class="lion-area"><div id="lion-stack" class="lion-stack"><div id="lion-a" class="lion still"></div><div id="lion-b" class="lion still is-hidden" aria-hidden="true"></div></div></div>
      <div id="result" class="result"></div>
      <footer class="stage-footer"><span>键盘：1 / 2 / ← / → / 5 / 6</span><button id="reset">↻ 归位</button></footer>
    </section>

    <aside>
      <section class="challenge">
        <div class="card-head"><b>⏱ 口令挑战</b><span>30 SEC</span></div>
        <div id="challenge-idle" class="challenge-idle">30 秒内根据语音口令<br>完成正确军训动作</div>
        <div id="challenge-running" class="challenge-running" hidden>
          <small>请完成指令</small><button id="target">立正！</button>
          <div class="metrics"><div><b id="time">30s</b><small>倒计时</small></div><div><b id="score">0</b><small>得分</small></div><div><b id="streak">0x</b><small>连击</small></div></div>
        </div>
        <button id="start" class="start">▶ 开始挑战</button>
      </section>

      <section class="controls"><div class="card-head"><b>动作控制台</b><span>6 ACTIONS</span></div><div id="buttons" class="button-grid"></div></section>
      <div class="motto">青春有芯 · 意志如钢 <span>›</span></div>
    </aside>
  </main>
  <script src="app.js?v=goose-user-sheet-1"></script>
</body>
</html>
